<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anima Anime</title>
    <link href="Style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Port+Lligat+Sans&family=Rubik+Maze&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="rubik-maze-regular">Anima Anime</h1>
        <input type="text" id="search-input" placeholder="Search" />
    </header>
    <template id="card-template">
      <div class="card border-info w-100">
        <div class="row g-0">
    <div class="col-md-3 text-center">
      <img src="..." class="img-fluid rounded-start" alt="...">
      <h5 class="card-title">Card title</h5>
    </div>
    <div class="col-md-9">
      <div class="card-body overflow-y-auto" style="max-height: 33vw;">
        <p class="card-text">This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
      </div>
    </div>
  </div>
      </div>
    </template>
    <main class="container">
      <div class="row g-4">
        <section class="col-sm-12">
          <div id="card-list"></div>
        </section>
      </div>
    </main>
</body>
</html>
